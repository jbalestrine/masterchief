<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MasterChief — IRC Chat (Echo)</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#eee;margin:0}
    .wrap{display:flex;height:100vh}
    .sidebar{width:260px;background:#0f0f12;padding:12px;border-right:1px solid #222;overflow:auto}
    .main{flex:1;display:flex;flex-direction:column}
    .header{background:#1b1b1f;padding:12px;border-bottom:1px solid #222;display:flex;gap:8px;align-items:center}
    .channel-title{font-weight:700;color:#9ad}
    .topic{color:#9a9;margin-left:12px;font-size:0.95em}
    .users{margin-top:12px}
    .user{padding:6px;border-radius:6px;margin-bottom:4px;cursor:pointer}
    .user:hover{background:#16161a}
    .messages{flex:1;overflow:auto;padding:12px;background:#070708}
    .msg{padding:8px;margin-bottom:6px;border-radius:6px}
    .msg.nick{font-weight:700;color:#8bd}
    .controls{padding:12px;border-top:1px solid #222;background:#0f0f10;display:flex;gap:8px}
    input[type=text]{background:#0b0b0c;border:1px solid #222;color:#eee;padding:8px;border-radius:6px;flex:1}
    button{background:#2b7;padding:color:#000;border:none;padding:8px 10px;border-radius:6px;cursor:pointer}
    .context{position:fixed;display:none;background:#111;border:1px solid #333;padding:6px;border-radius:6px;z-index:2000}
    .context button{display:block;width:100%;text-align:left;padding:6px;background:transparent;border:none;color:#ddd}
  </style>
</head>
<body>
<div class="wrap">
  <div class="sidebar">
    <h3>IRC — Connect</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <input id="nickInput" type="text" placeholder="nick" value="web_echo" />
      <input id="chanInput" type="text" placeholder="#channel" value="#echo" style="width:110px" />
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>
    <div class="users">
      <h4>Users (<span id="userCount">0</span>)</h4>
      <div id="userList"></div>
    </div>
  </div>
  <div class="main">
    <div class="header">
      <div class="channel-title" id="channelLabel">#echo</div>
      <div class="topic" id="channelTopic">(no topic)</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="controls">
      <input id="msgInput" type="text" placeholder="Type message and Enter — sends to IRC + Echo" />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<div id="ctx" class="context"></div>

<script>
// Minimal IRC/Echo bridge UI
let bridgeToken = null;
let connected = false;
let nick = '';
let channel = '';
let pollTimer = null;
const users = new Set();

function addMessage(nickOrSys, text, cls=''){
  const m = document.createElement('div'); m.className = 'msg '+cls;
  m.innerHTML = '<div class="msgnick" style="font-weight:700;color:#9ad">'+escapeHtml(nickOrSys)+'</div><div style="margin-top:4px">'+escapeHtml(text)+'</div>';
  const box = document.getElementById('messages'); box.appendChild(m); box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function connect(){
  nick = document.getElementById('nickInput').value || ('web_'+Date.now()%1000);
  channel = document.getElementById('chanInput').value || '#echo';
  document.getElementById('channelLabel').textContent = channel;
  try{
    const res = await fetch('/irc/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nick: nick, channel: channel})});
    const j = await res.json();
    if(j && j.bridge_token){
      bridgeToken = j.bridge_token;
      connected = true; addMessage('SYSTEM','Connected as '+nick);
      startPolling();
    } else if(j && j.success && j.bridges){
      bridgeToken = j.bridges[channel] && j.bridges[channel].bridge_token ? j.bridges[channel].bridge_token : (j.bridge_token || null);
      connected = !!bridgeToken; if(connected) startPolling(); addMessage('SYSTEM','Connected (legacy response)');
    } else {
      addMessage('SYSTEM', 'Connect failed: '+JSON.stringify(j));
    }
  }catch(e){ addMessage('SYSTEM','Connect error: '+e); }
}

async function disconnect(){
  connected=false; bridgeToken=null; stopPolling(); addMessage('SYSTEM','Disconnected');
}

function startPolling(){ if(pollTimer) return; pollTimer = setInterval(pollRecv, 1000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function pollRecv(){
  if(!bridgeToken) return;
  try{
    // try GET first
    let url = '/irc/recv?bridge_token='+encodeURIComponent(bridgeToken);
    let r = await fetch(url,{cache:'no-store'});
    if(r.status===403){ addMessage('SYSTEM','bridge_recv 403 — token invalid'); disconnect(); return; }
    let j = await r.json().catch(()=>null);
    if(!j || !j.lines){
      // fallback to POST
      const rp = await fetch('/irc/recv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bridge_token:bridgeToken})});
      j = await rp.json().catch(()=>null);
    }
    if(j && Array.isArray(j.lines)){
      j.lines.forEach(handleIrcLine);
    }
  }catch(e){ /* ignore transient errors */ }
}

function handleIrcLine(line){
  // example line: ":nick!user@host PRIVMSG #chan :message"
  try{
    addMessage('RAW', line);
    const m = line.match(/^:([^! ]+)!.*? PRIVMSG ([^ ]+) :(.+)$/);
    if(m){ const from=m[1], targ=m[2], text=m[3];
      // update users
      if(!users.has(from)){ users.add(from); renderUserList(); }
      // show
      addMessage(from, text);
      // forward to Echo
      forwardToEcho(from, text);
      return;
    }
    const join = line.match(/^:([^ ]+) JOIN :?([^ ]+)$/);
    if(join){ users.add(join[1]); renderUserList(); addMessage('SYSTEM', join[1]+' joined'); return; }
    const part = line.match(/^:([^ ]+) PART ([^ ]+)(?: :(.+))?$/);
    if(part){ users.delete(part[1]); renderUserList(); addMessage('SYSTEM', part[1]+' left'); return; }
    const topic = line.match(/^:[^ ]+ 332 [^ ]+ ([^ ]+) :(.+)$/); // RPL_TOPIC
    if(topic){ document.getElementById('channelTopic').textContent = topic[2]; return; }
  }catch(e){ console.error('parse',e); }
}

function renderUserList(){ const el=document.getElementById('userList'); el.innerHTML=''; const arr=Array.from(users).sort(); arr.forEach(u=>{ const d=document.createElement('div'); d.className='user'; d.textContent=u; d.oncontextmenu = (ev)=>{ ev.preventDefault(); showContextMenu(ev.pageX, ev.pageY, u); }; d.onclick = ()=>{ document.getElementById('msgInput').value = '/msg '+u+' '; document.getElementById('msgInput').focus(); }; el.appendChild(d); }); document.getElementById('userCount').textContent = users.size; }

function showContextMenu(x,y,username){ const ctx = document.getElementById('ctx'); ctx.style.left = x+'px'; ctx.style.top = y+'px'; ctx.innerHTML = '';
  const ops = [ ['WHOIS','whois'], ['Op (+o)','op'], ['Deop (-o)','deop'], ['Kick','kick'], ['Message','msg'], ['Listen toggle','listen'] ];
  ops.forEach(o=>{ const b=document.createElement('button'); b.textContent = o[0]; b.onclick = ()=>{ ctx.style.display='none'; runUserAction(o[1], username); }; ctx.appendChild(b); });
  ctx.style.display='block';
}
window.addEventListener('click', ()=>{ document.getElementById('ctx').style.display='none'; });

async function runUserAction(action, username){ if(!bridgeToken) return; try{
  if(action==='whois') return sendRaw('WHOIS '+username);
  if(action==='op') return sendRaw('MODE '+channel+' +o '+username);
  if(action==='deop') return sendRaw('MODE '+channel+' -o '+username);
  if(action==='kick'){
    const reason = prompt('Kick reason?','requested'); if(reason===null) return; return sendRaw('KICK '+channel+' '+username+' :'+reason);
  }
  if(action==='msg'){
    const txt = prompt('Message to '+username+':'); if(!txt) return; return sendRaw('PRIVMSG '+username+' :'+txt);
  }
  if(action==='listen'){
    // toggle remote listening: send custom command PRIVMSG to channel
    return sendRaw('PRIVMSG '+channel+' :!echo toggle '+username);
  }
}catch(e){ addMessage('SYSTEM','action failed: '+e); }}

async function sendRaw(raw){ try{
    const payload = { bridge_token: bridgeToken, raw: raw };
    await fetch('/irc/bridge_send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    addMessage('SENT', raw);
  }catch(e){ addMessage('SYSTEM','sendRaw error: '+e); }
}

async function sendMessage(){ if(!bridgeToken) return addMessage('SYSTEM','Not connected'); const txt = document.getElementById('msgInput').value.trim(); if(!txt) return; document.getElementById('msgInput').value='';
  // if slash command, treat locally
  if(txt.startsWith('/topic ')){ const t=txt.substring(7); return sendRaw('TOPIC '+channel+' :'+t); }
  if(txt.startsWith('/whois ')){ const who = txt.split(' ')[1]; return sendRaw('WHOIS '+who); }
  // send as PRIVMSG to channel
  try{
    await fetch('/irc/bridge_send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bridge_token: bridgeToken, channel: channel, message: txt})});
    addMessage(nick, txt);
    // also send to Echo and forward Echo response back into channel
    const rr = await fetch('/api/echo/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message: txt, session_id: 'irc_'+channel})});
    const j = await rr.json().catch(()=>null);
    if(j && j.response){ const resp = j.response; // post into IRC
      await fetch('/irc/bridge_send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bridge_token: bridgeToken, channel: channel, message: resp})});
      addMessage('Echo', resp);
    }
  }catch(e){ addMessage('SYSTEM','send error: '+e); }
}

async function forwardToEcho(from, text){
  try{
    await fetch('/api/echo/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message: text, session_id: 'irc_'+channel, from: from})});
  }catch(e){ console.error('forward echo failed',e); }
}

document.getElementById('connectBtn').onclick = connect;
document.getElementById('disconnectBtn').onclick = disconnect;
document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } });

// small helper to load existing echo sessions/users periodically (optional)
setInterval(()=>{ /* placeholder for future sync */ }, 60000);

</script>
</body>
</html>
