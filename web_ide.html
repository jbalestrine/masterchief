<!doctype html>
<html>
	<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MasterChief - DevOps Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#1a1a1a;color:#e0e0e0;line-height:1.6;}
header{background:#2d2d2d;padding:20px;margin-bottom:30px;border-bottom:3px solid #4CAF50;}
h1{color:#4CAF50;font-size:2.5em;margin-bottom:10px;}
.subtitle{color:#888;font-size:1.1em;}
nav{background:#252525;padding:15px;margin-bottom:30px;border-radius:8px;}
nav a{color:#4CAF50;text-decoration:none;margin-right:20px;padding:8px 15px;border-radius:5px;display:inline-block;transition:all 0.3s;}
nav a:hover,nav a.active{background:#4CAF50;color:#fff;}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:30px;}
.card{background:#2d2d2d;padding:25px;border-radius:10px;border-left:4px solid #4CAF50;box-shadow:0 4px 6px rgba(0,0,0,0.3);}
.card h3{color:#4CAF50;margin-bottom:15px;font-size:1.4em;}
.stat-value{font-size:2.5em;font-weight:bold;color:#fff;margin:10px 0;}
.stat-label{color:#888;font-size:0.9em;text-transform:uppercase;}
.progress-bar{background:#1a1a1a;height:20px;border-radius:10px;overflow:hidden;margin:10px 0;}
.progress-fill{background:linear-gradient(90deg,#4CAF50,#8BC34A);height:100%;transition:width 0.3s;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{padding:12px;text-align:left;border-bottom:1px solid #3a3a3a;}
th{background:#252525;color:#4CAF50;font-weight:bold;}
tr:hover{background:#333;}
.btn{background:#4CAF50;color:#fff;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px;transition:all 0.3s;}
.btn:hover{background:#45a049;transform:translateY(-2px);}
.btn-danger{background:#f44336;}
.btn-danger:hover{background:#da190b;}
.btn-warning{background:#ff9800;}
.btn-warning:hover{background:#e68900;}
.btn-info{background:#2196F3;}
.btn-info:hover{background:#0b7dda;}
.form-group{margin-bottom:20px;}
label{display:block;margin-bottom:8px;color:#4CAF50;font-weight:bold;}
input,textarea,select{width:100%;padding:12px;background:#1a1a1a;border:1px solid #3a3a3a;color:#e0e0e0;border-radius:5px;font-size:1em;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#4CAF50;}
.section{background:#2d2d2d;padding:25px;border-radius:10px;margin-bottom:25px;}
.status-badge{padding:5px 12px;border-radius:15px;font-size:0.85em;font-weight:bold;}
.status-running{background:#4CAF50;color:#fff;}
.status-stopped{background:#f44336;color:#fff;}
.alert{padding:15px;margin-bottom:20px;border-radius:5px;border-left:4px solid;}
.alert-success{background:#1b5e20;border-color:#4CAF50;color:#c8e6c9;}
.alert-error{background:#b71c1c;border-color:#f44336;color:#ffcdd2;}
.alert-info{background:#0d47a1;border-color:#2196F3;color:#bbdefb;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;}
.modal-content{background:#2d2d2d;margin:50px auto;padding:30px;border-radius:10px;max-width:600px;position:relative;}
.close{position:absolute;top:15px;right:20px;font-size:30px;cursor:pointer;color:#888;}
.close:hover{color:#4CAF50;}
pre{background:#1a1a1a;padding:15px;border-radius:5px;overflow-x:auto;border-left:3px solid #4CAF50;}
code{color:#4CAF50;}
.file-upload{border:2px dashed #4CAF50;padding:40px;text-align:center;border-radius:10px;cursor:pointer;transition:all 0.3s;}
.file-upload:hover{background:#252525;border-color:#8BC34A;}
</style>
</head>
<body>
<div class="container">
<header>
</div>

<!-- Minimal IDE UI: file tree, editor, controls, output, and jobs -->
<div style="display:flex;gap:12px;padding:20px;">
	<div style="width:260px;background:#111;padding:10px;border-radius:6px;" id="ideFiles">Loading...</div>
	<div style="flex:1; display:flex; flex-direction:column; gap:8px;">
		<div style="display:flex;justify-content:space-between;align-items:center;">
			<div>File: <span id="ideStatus"></span></div>
			<div style="display:flex;gap:8px;align-items:center;">
				<select id="ideShell" style="background:#111;color:#eee;border:1px solid #333;padding:6px;border-radius:4px;"><option value="auto">Auto</option><option value="bash">bash</option><option value="powershell">PowerShell</option><option value="python">Python</option></select>
				<label style="font-size:0.9em;"><input type="checkbox" id="ideVerbose"> Verbose</label>
				<label style="font-size:0.9em;"><input type="checkbox" id="ideRemote"> Remote</label>
				<input id="ideRemoteTarget" placeholder="remote target" style="width:160px;padding:6px;background:#111;color:#eee;border:1px solid #333;border-radius:4px;">
			</div>
		</div>
		<textarea id="ideEditor" style="flex:1;height:320px;font-family:monospace;padding:8px;background:#0b0b0b;color:#eee;border:1px solid #333;border-radius:6px;"></textarea>
		<div style="display:flex;gap:8px;">
			<button id="btnSave" class="btn" onclick="ideSave()">Save</button>
			<button id="btnRun" class="btn" onclick="ideRun()">Run</button>
			<button id="btnRunAuto" class="btn" onclick="ideRunAuto()">Run (Auto)</button>
			<button id="btnRefresh" class="btn" onclick="ideRefresh()">Refresh</button>
			<button id="btnSaveCreds" class="btn" onclick="saveRemoteCreds()">Save Creds</button>
			<button id="btnLoadCreds" class="btn" onclick="loadRemoteCreds()">Load Creds</button>
		</div>
	</div>
	<div style="width:360px;">
		<div style="margin-bottom:8px;"><strong>Output</strong></div>
		<div style="background:#0b0b0b;padding:8px;border-radius:6px;height:200px;overflow:auto"><pre id="ideOutput" style="white-space:pre-wrap;margin:0;font-family:monospace;color:#eee;"></pre></div>
		<div style="margin-top:8px;"><strong>Jobs</strong><div id="jobList"></div></div>
	</div>
</div>

<script>
// Clean, minimal Web IDE client script
const appendOutput = (s) => { const o = document.getElementById('ideOutput'); if(!o) return; o.textContent += s; o.parentElement.scrollTop = o.parentElement.scrollHeight; };

async function ideRefresh(){
	const el = document.getElementById('ideFiles');
	try{
		el.textContent = 'Loading...';
		const r = await fetch('/api/ide/scripts');
		if(!r.ok){ el.textContent = 'Failed to load scripts: HTTP '+r.status; return }
		const j = await r.json();
		el.innerHTML = '';
		(j.files||[]).forEach(f=>{
			const d = document.createElement('div'); d.style.padding='4px'; d.style.borderBottom='1px dashed #ccc';
			const a = document.createElement('a'); a.href='#'; a.textContent = f.name; a.onclick = ()=>{ loadFile(encodeURIComponent(f.name)); return false; };
			d.appendChild(a);
			el.appendChild(d);
		});
		await loadTree('');
	}catch(e){ console.error(e); el.textContent = 'Failed to load scripts: '+e; }
}

async function loadTree(path){
	try{ path = decodeURIComponent(path||''); }catch(e){}
	const r = await fetch('/api/ide/tree?path='+encodeURIComponent(path||''));
	const j = await r.json();
	const el = document.getElementById('ideFiles');
	const tree = document.createElement('div'); tree.style.maxHeight='280px'; tree.style.overflow='auto';
	if(!j.ok){ el.textContent = 'Failed to load tree'; return }
	j.nodes.forEach(n=>{
		const row = document.createElement('div'); row.style.padding='4px'; row.style.borderBottom='1px dashed #222';
		if(n.type==='dir'){
			const btn = document.createElement('button'); btn.textContent = 'Open'; btn.onclick = ()=> loadTree(encodeURIComponent(n.path)); row.appendChild(document.createTextNode(n.name + '/ ')); row.appendChild(btn);
		} else {
			const a = document.createElement('a'); a.href='#'; a.textContent = n.name; a.onclick = ()=>{ loadFile(encodeURIComponent(n.path)); return false; }; row.appendChild(a); row.appendChild(document.createTextNode(' ' + n.size + ' bytes'));
		}
		tree.appendChild(row);
	});
	el.innerHTML = '';
	el.appendChild(tree);
}

function addJobToList(exec_id){
	const list = document.getElementById('jobList');
	const row = document.createElement('div'); row.id = 'job-'+exec_id; row.style.borderBottom='1px dashed #222'; row.style.padding='6px';
	row.innerHTML = `<div><strong>${exec_id}</strong> <span id="job-status-${exec_id}">queued</span> <button id="job-view-${exec_id}">View</button></div><pre id="job-out-${exec_id}" style="white-space:pre-wrap;max-height:120px;overflow:auto;"></pre>`;
	list.prepend(row);
	document.getElementById('job-view-'+exec_id).onclick = ()=> viewJob(exec_id);
	const iv = setInterval(async ()=>{
		try{
			const r = await fetch('/api/ide/exec_status?exec_id='+encodeURIComponent(exec_id));
			if(!r.ok){ document.getElementById('job-status-'+exec_id).textContent = 'error'; appendOutput('\n[job error] HTTP '+r.status+' for '+exec_id+'\n'); clearInterval(iv); return }
			const j = await r.json();
			if(!j.ok){ document.getElementById('job-status-'+exec_id).textContent = 'error'; appendOutput('\n[job error] '+(j.error||'unknown')+'\n'); clearInterval(iv); return }
			document.getElementById('job-status-'+exec_id).textContent = j.job.status;
			document.getElementById('job-out-'+exec_id).textContent = (j.job.stdout||'') + (j.job.stderr?('\n[stderr]\n'+j.job.stderr):'');
			if(j.job.status==='finished' || j.job.status==='error') clearInterval(iv);
		}catch(e){ document.getElementById('job-status-'+exec_id).textContent = 'error'; appendOutput('\n[job poll error] '+e+'\n'); clearInterval(iv); }
	},1500);
}

async function runAsync(){
	const cmd = document.getElementById('cliCommand').value || '';
	if(!cmd){ appendOutput('\n[error] Enter command or script path\n'); return }
	try{ const r = await fetch('/api/ide/exec_async',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})}); if(!r.ok){ appendOutput('\n[error] Failed to start: HTTP '+r.status+'\n'); return } const j = await r.json(); if(!j.ok){ appendOutput('\n[error] Failed to start: '+(j.error||JSON.stringify(j))+'\n'); return } addJobToList(j.exec_id); appendOutput('\n[info] Started async job '+j.exec_id+'\n'); }catch(e){ appendOutput('\n[error] Exec async failed: '+e+'\n'); }
}

async function runSync(){
	const cmd = document.getElementById('cliCommand').value || '';
	if(!cmd){ appendOutput('\n[error] Enter command or script path\n'); return }
	appendOutput('\n--- Running (sync) '+cmd+' ---\n');
	try{ const r = await fetch('/api/ide/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:cmd})}); const j = await r.json(); if(j.ok){ appendOutput(j.stdout||''); if(j.stderr) appendOutput('\n[stderr]\n'+j.stderr); appendOutput('\n--- EXIT '+j.returncode+' ---\n'); } else appendOutput('\n[error] '+(j.error||JSON.stringify(j))+'\n'); }catch(e){ appendOutput('\n[error] Exec failed: '+e+'\n'); }
}

async function viewJob(exec_id){ try{ const r = await fetch('/api/ide/exec_status?exec_id='+encodeURIComponent(exec_id)); if(!r.ok){ appendOutput('\n[error] Job not found (HTTP '+r.status+')\n'); return } const j = await r.json(); if(!j.ok){ appendOutput('\n[error] Job not found: '+(j.error||'')+'\n'); return } appendOutput('\n--- Job '+exec_id+' ---\n'+(j.job.stdout||'')+'\n'+(j.job.stderr?('\n[stderr]\n'+j.job.stderr):'')+'\n'); }catch(e){ appendOutput('\n[error] viewJob failed: '+e+'\n'); } }

async function loadFile(name){ try{ name = decodeURIComponent(name); const r = await fetch('/api/ide/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:name})}); if(!r.ok){ appendOutput('\n[error] Load failed: HTTP '+r.status+'\n'); return } const j = await r.json(); if(j.ok){ document.getElementById('ideEditor').value = j.content; document.getElementById('ideStatus').textContent = name; appendOutput('\n[info] Loaded '+name+'\n'); } else appendOutput('\n[error] Load failed: '+(j.error||JSON.stringify(j))+'\n'); }catch(e){ appendOutput('\n[error] loadFile failed: '+e+'\n'); } }

async function ideSave(){ try{ let name = document.getElementById('ideStatus').textContent || ''; if(!name) name = prompt('Filename to save as'); if(!name) return appendOutput('\n[error] Save cancelled\n'); const content = document.getElementById('ideEditor').value; const r = await fetch('/api/ide/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:name,content})}); if(!r.ok){ appendOutput('\n[error] Save failed: HTTP '+r.status+'\n'); return } const j = await r.json(); if(j.ok){ ideRefresh(); document.getElementById('ideStatus').textContent = name; appendOutput('\n[info] Saved '+name+'\n'); } else appendOutput('\n[error] Save failed: '+(j.error||JSON.stringify(j))+'\n'); }catch(e){ appendOutput('\n[error] ideSave failed: '+e+'\n'); } }

async function ideRun(){ try{ const name = document.getElementById('ideStatus').textContent || ''; const content = document.getElementById('ideEditor').value; const shell = document.getElementById('ideShell').value; const verbose = document.getElementById('ideVerbose').checked; const remote = document.getElementById('ideRemote').checked; const target = document.getElementById('ideRemoteTarget').value; const payload = {shell, verbose, remote, remote_target: target}; if(name) payload.filename = name; payload.content = content; appendOutput('\n--- Executing ---\n'); const r = await fetch('/api/ide/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const j = await r.json(); if(j.ok){ appendOutput(j.stdout||''); if(j.stderr) appendOutput('\n[stderr]\n'+j.stderr); appendOutput('\n--- EXIT '+j.returncode+' ---\n'); } else appendOutput('\n[error] '+(j.error||JSON.stringify(j))+'\n'); }catch(e){ appendOutput('\n[error] ideRun failed: '+e+'\n'); } }

async function ideRunAuto(){ try{ const name = document.getElementById('ideStatus').textContent || ''; const content = document.getElementById('ideEditor').value; const verbose = document.getElementById('ideVerbose').checked; const remote = document.getElementById('ideRemote').checked; const target = document.getElementById('ideRemoteTarget').value; const payload = {verbose, remote, remote_target: target}; if(name) payload.filename = name; payload.content = content; appendOutput('\n--- Executing (auto) ---\n'); const r = await fetch('/api/ide/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const j = await r.json(); if(j.ok){ appendOutput(j.stdout||''); if(j.stderr) appendOutput('\n[stderr]\n'+j.stderr); appendOutput('\n--- EXIT '+j.returncode+' ---\n'); } else appendOutput('\n[error] '+(j.error||JSON.stringify(j))+'\n'); }catch(e){ appendOutput('\n[error] ideRunAuto failed: '+e+'\n'); } }

async function saveRemoteCreds(){ try{ const target=document.getElementById('ideRemoteTarget').value; const user=document.getElementById('ideRemoteUser').value; const pw=document.getElementById('ideRemotePass').value; if(!target||!user||!pw){ appendOutput('\n[error] target,user,password required\n'); return; } const r = await fetch('/api/ide/remote/creds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target,username:user,password:pw})}); if(!r.ok){ appendOutput('\n[error] Save creds failed: HTTP '+r.status+'\n'); return } const j = await r.json(); if(j.ok) appendOutput('\n[info] Saved remote creds for '+target+'\n'); else appendOutput('\n[error] Save failed: '+(j.error||JSON.stringify(j))+'\n'); }catch(e){ appendOutput('\n[error] saveRemoteCreds failed: '+e+'\n'); } }

async function loadRemoteCreds(){ try{ const target=document.getElementById('ideRemoteTarget').value; if(!target){ appendOutput('\n[error] enter target host to load\n'); return; } const r = await fetch('/api/ide/remote/creds?target='+encodeURIComponent(target)); if(!r.ok){ appendOutput('\n[error] Load creds failed: HTTP '+r.status+'\n'); return } const j = await r.json(); if(j.ok && j.cred){ document.getElementById('ideRemoteUser').value = j.cred.username||''; document.getElementById('ideRemotePass').value = j.cred.password||''; appendOutput('\n[info] Loaded creds for '+target+'\n'); } else appendOutput('\n[info] No creds found for '+target+'\n'); }catch(e){ appendOutput('\n[error] loadRemoteCreds failed: '+e+'\n'); } }

function clearOutput(){ document.getElementById('ideOutput').textContent=''; }
function copyOutput(){ const t=document.getElementById('ideOutput').textContent; if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>appendOutput('\n[info] Copied output to clipboard\n')).catch(e=>appendOutput('\n[error] Clipboard copy failed: '+e+'\n')); } else { appendOutput('\n[error] Clipboard API not available\n'); } }
function createNew(){ const n=document.getElementById('newName').value || prompt('Filename'); if(!n) return appendOutput('\n[info] Create cancelled\n'); document.getElementById('ideStatus').textContent = n; document.getElementById('ideEditor').value = ''; appendOutput('\n[info] New file: '+n+'\n'); }
async function ideUpload(){ appendOutput('\n[info] Use Save to write into scripts folder on the server\n'); }

window.addEventListener('DOMContentLoaded', ideRefresh);
ideRefresh();
</script>

</div>
<script>
function confirmDelete(item){return confirm('Are you sure you want to delete '+item+'?');}
function openModal(modalId){document.getElementById(modalId).style.display='block';}
function closeModal(modalId){document.getElementById(modalId).style.display='none';}
function refreshStats(){
	fetch('/api/stats').then(r=>r.json()).then(data=>{
		try{
			const cpuValue = document.getElementById('cpu-value'); if(cpuValue) cpuValue.textContent = data.cpu.percent.toFixed(1)+'%';
			const cpuProg = document.getElementById('cpu-progress'); if(cpuProg) cpuProg.style.width = data.cpu.percent+'%';
			const memValue = document.getElementById('mem-value'); if(memValue) memValue.textContent = data.memory.percent.toFixed(1)+'%';
			const memProg = document.getElementById('mem-progress'); if(memProg) memProg.style.width = data.memory.percent+'%';
			const diskValue = document.getElementById('disk-value'); if(diskValue) diskValue.textContent = data.disk.percent.toFixed(1)+'%';
			const diskProg = document.getElementById('disk-progress'); if(diskProg) diskProg.style.width = data.disk.percent+'%';
		}catch(e){
			console.error('Failed to apply stats to DOM:', e);
			appendOutput('\n[stats error] '+e+'\n');
		}
	}).catch(err=>{ console.error('Failed to refresh stats:',err); appendOutput('\n[stats fetch error] '+err+'\n'); });
}
setInterval(refreshStats,5000);
function refreshIndex(){
	fetch('/scripts/refresh_index',{method:'POST'}).then(async r=>{
		if(r.status===401){
			// server requires admin token
			let token = prompt('Admin token required to refresh index:');
			if(!token){ appendOutput('\n[info] Refresh cancelled\n'); return }
			try{
				const r2 = await fetch('/scripts/refresh_index',{method:'POST',headers:{'X-ADMIN-TOKEN':token}});
				const j2 = await r2.json();
				if(j2.ok) location.reload(); else appendOutput('\n[error] Refresh failed: '+(j2.error||'unknown')+'\n');
			}catch(e){ appendOutput('\n[error] Refresh error: '+e+'\n'); }
		} else {
			const j = await r.json();
			if(j.ok){ location.reload(); } else { appendOutput('\n[error] Refresh failed: '+(j.error||'unknown')+'\n'); }
		}
	}).catch(e=>{ appendOutput('\n[error] Refresh error: '+e+'\n'); });
}
</script>
<!-- Floating Action Buttons -->
<div id="fabContainer" style="position:fixed;right:20px;bottom:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;">
		<button title="New" onclick="openModal('ideWizardModal')" style="border-radius:50%;width:56px;height:56px;font-size:20px;padding:0;display:flex;align-items:center;justify-content:center;background:#4CAF50;color:#fff;border:none;">+</button>
		<button title="Save" onclick="ideSave()" style="border-radius:50%;width:48px;height:48px;background:#4CAF50;color:#fff;border:none;">💾</button>
		<button title="Run" onclick="ideRun()" style="border-radius:50%;width:48px;height:48px;background:#4CAF50;color:#fff;border:none;">▶</button>
		<button title="Files" onclick="ideRefresh()" style="border-radius:50%;width:48px;height:48px;background:#4CAF50;color:#fff;border:none;">📁</button>
</div>

<!-- IDE Wizard Modal -->
<div id="ideWizardModal" class="modal">
	<div class="modal-content">
		<span class="close" onclick="closeModal('ideWizardModal')">&times;</span>
		<h3>IDE Wizard</h3>
		<div style="margin-top:8px;">
			<label>Script name: <input id="wizard_name" placeholder="new-script.sh" style="width:100%;margin-top:6px"></label>
		</div>
		<div style="margin-top:8px;">
			<label>Template:
				<select id="wizard_template" style="width:100%;margin-top:6px">
					<option value="bash">Bash: Hello</option>
					<option value="powershell">PowerShell: Hello</option>
					<option value="python">Python: Hello</option>
					<option value="tf">Terraform: basic main.tf</option>
					<option value="arm">ARM Template: skeleton</option>
					<option value="js">Node.js: console</option>
					<option value="csharp">C#: Console App</option>
				</select>
			</label>
		</div>
		<div style="margin-top:12px;display:flex;gap:8px;">
			<button class="btn" onclick="applyWizard()">Create</button>
			<button class="btn btn-warning" onclick="closeModal('ideWizardModal')">Cancel</button>
		</div>
	</div>
</div>

<script>
function applyWizard(){
	const name = document.getElementById('wizard_name').value || 'new-script.sh';
	const tmpl = document.getElementById('wizard_template').value;
	let content = '';
	if(tmpl=='bash') content = '#!/bin/bash\n\necho "Hello from MasterChief"\n';
	else if(tmpl=='powershell') content = '# PowerShell script\nWrite-Host "Hello from MasterChief"\n';
	else if(tmpl=='python') content = '#!/usr/bin/env python3\nprint("Hello from MasterChief")\n';
	else if(tmpl=='tf') content = 'terraform {\n  required_providers {\n    null = {\n      source = "hashicorp/null"\n    }\n  }\n}\n\nprovider "null" {}\n\nresource "null_resource" "example" {\n  provisioner "local-exec" {\n    command = "echo Hello from MasterChief"\n  }\n}\n';
	else if(tmpl=='arm') content = '{\n  "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",\n  "contentVersion": "1.0.0.0",\n  "resources": [\n    {\n      "type": "Microsoft.Resources/deployments",\n      "apiVersion": "2021-04-01",\n      "name": "example",\n      "properties": {\n        "mode": "Incremental",\n        "template": {\n          "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",\n          "contentVersion": "1.0.0.0",\n          "resources": []\n        }\n      }\n    }\n  ]\n}\n';
	else if(tmpl=='js') content = 'console.log("Hello from MasterChief");\n';
	else if(tmpl=='csharp') content = 'using System;\nclass Program {\n  static void Main(string[] args) {\n    Console.WriteLine("Hello from MasterChief");\n  }\n}\n';
	// ensure extension matches template if not provided
	const extMap = {bash:'.sh', powershell:'.ps1', python:'.py', tf:'.tf', arm:'.json', js:'.js', csharp:'.cs'};
	let finalName = name;
	const sel = tmpl;
	if(!finalName.includes('.') && extMap[sel]) finalName = finalName + extMap[sel];
	document.getElementById('ideEditor').value = content;
	document.getElementById('ideStatus').textContent = finalName;
	closeModal('ideWizardModal');
}
</script>

<!-- Lightweight client logging to help diagnose button/JS failures -->
<script>
(function(){
	async function sendLog(ev, detail){
		try{ await fetch('/api/ide/log', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({event: ev, detail}) }); }
		catch(e){ console.error('IDE log send failed', e); }
	}
	const ids = ['btnSaveCreds','btnLoadCreds','btnSave','btnRun','btnRunAuto','btnUpload','btnRefresh'];
	ids.forEach(id=>{
		const b = document.getElementById(id);
		if(b) b.addEventListener('click', e=>{ sendLog('button_click', {id: id, text: b.innerText}); });
	});
	window.addEventListener('error', function(err){ sendLog('js_error', {message: err.message, filename: err.filename, lineno: err.lineno, colno: err.colno}); });
	window.addEventListener('unhandledrejection', function(ev){ sendLog('unhandled_promise', {reason: String(ev.reason)}); });
})();
</script>
</body>
</html>
