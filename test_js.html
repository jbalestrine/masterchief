<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Test</title>
</head>
<body>
    <h1>Testing JavaScript Functions</h1>
    <div id="output"></div>

    <script>
        // Test if functions are defined
        function testFunctions() {
            const output = document.getElementById('output');
            let results = '';

            try {
                if (typeof generateCAF === 'function') {
                    results += '✓ generateCAF function is defined<br>';
                } else {
                    results += '✗ generateCAF function is NOT defined<br>';
                }
            } catch (e) {
                results += '✗ Error checking generateCAF: ' + e.message + '<br>';
            }

            try {
                if (typeof switchFileTab === 'function') {
                    results += '✓ switchFileTab function is defined<br>';
                } else {
                    results += '✗ switchFileTab function is NOT defined<br>';
                }
            } catch (e) {
                results += '✗ Error checking switchFileTab: ' + e.message + '<br>';
            }

            try {
                if (typeof generateVariablesTemplate === 'function') {
                    results += '✓ generateVariablesTemplate function is defined<br>';
                } else {
                    results += '✗ generateVariablesTemplate function is NOT defined<br>';
                }
            } catch (e) {
                results += '✗ Error checking generateVariablesTemplate: ' + e.message + '<br>';
            }

            output.innerHTML = results;
        }

        // Load the main script
        const script = document.createElement('script');
        script.src = 'http://localhost:8080/static/web_ide.js';
        script.onload = function() {
            testFunctions();
        };
        script.onerror = function() {
            document.getElementById('output').innerHTML = 'Failed to load script from localhost:8080';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
