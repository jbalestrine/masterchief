trigger:
  branches:
    include:
      - main   # Deploy on main branch changes, adjust as needed

variables:
  azureSubscription: 'Enterprise-Service-Connection'   # Service connection in ADO
  resourceGroupName: 'EnterpriseAppRG'               # Default RG
  location: 'eastus'                                 # Default region
  armTemplateFile: 'arm-template.json'              # ARM template path
  armParametersFile: 'arm-parameters.json'         # Optional parameters file

stages:
- stage: DeployARM
  displayName: "Deploy Enterprise ARM Template"
  jobs:
  - job: ARMDeployment
    displayName: "ARM Template Deployment"
    pool:
      vmImage: 'ubuntu-latest'   # Can use windows-latest if scripts require it

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Azure Login'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Logged in via Azure CLI."

    - task: AzureCLI@2
      displayName: 'Deploy ARM Template'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Ensure RG exists
          if (-not (az group exists --name $(resourceGroupName))) {
              az group create --name $(resourceGroupName) --location $(location)
              Write-Host "Resource group $(resourceGroupName) created."
          } else {
              Write-Host "Resource group $(resourceGroupName) already exists."
          }

          # Deploy ARM template
          az deployment group create `
              --resource-group $(resourceGroupName) `
              --template-file $(armTemplateFile) `
              --parameters @$(armParametersFile) `
              --verbose
          
          Write-Host "ARM Template deployment completed successfully."

    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM Deployment Logs'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/logs'
        artifactName: 'ARMDeploymentLogs'
        publishLocation: 'pipeline'
